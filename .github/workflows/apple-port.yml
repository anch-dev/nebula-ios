name: Apple port

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux-arm64:
    name: Linux ARM64 (build + tests)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y clang ninja-build cmake
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
      - name: Build
        run: cmake --build build -- -k 0 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Test
        run: ctest --test-dir build --output-on-failure 2>&1 | tee test.log; exit ${PIPESTATUS[0]}
      - name: Surface errors
        if: failure()
        run: |
          { grep -A40 "The following tests FAILED" test.log 2>/dev/null;
            grep -E "error:" build.log 2>/dev/null | head -20;
            grep -E "FAILED|Failed" test.log 2>/dev/null | sort | uniq -c | sort -rn | head -40; } | sed 's/^/::error::/' || true

  macos-arm64:
    name: macOS Apple Silicon (build + tests)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: brew install ninja
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64
      - name: Build
        run: cmake --build build -- -k 0 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Test
        run: ctest --test-dir build --output-on-failure 2>&1 | tee test.log; exit ${PIPESTATUS[0]}
      - name: Surface errors
        if: failure()
        run: |
          { grep -A40 "The following tests FAILED" test.log 2>/dev/null;
            grep -E "error:" build.log 2>/dev/null | head -20;
            grep -E "FAILED|Failed" test.log 2>/dev/null | sort | uniq -c | sort -rn | head -40; } | sed 's/^/::error::/' || true

  ios-arm64:
    name: iOS arm64 (compile only)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: brew install ninja
      - name: Configure
        run: >
          cmake -S . -B build-ios -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_SYSTEM_NAME=iOS
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0
          -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY
      - name: Build
        run: cmake --build build-ios 2>&1 | tee build-ios.log; exit ${PIPESTATUS[0]}
      - name: Surface errors
        if: failure()
        run: grep -E "error|Error" build-ios.log | head -40 | sed 's/^/::error::/' || true
      # What a PC needs to compile the game modules for iOS (docs/APPLE_PORT.md
      # step 8): runtime headers and libraries, and the iOS SDK headers and
      # link stubs they need.
      - name: Package the module SDK
        run: |
          brew install llvm lld
          PROBE_CLANG="$(brew --prefix llvm)/bin/clang++" tools/ios/package-module-sdk.sh build-ios nebula-ios-module-sdk
      - name: Check the module SDK with LLVM clang and ld64.lld, as on a PC
        shell: pwsh
        run: |
          $env:PATH = "$(brew --prefix lld)/bin:" + $env:PATH
          ./tools/ios/build-modules.ps1 -Generated tools/ios/test/fake-generated -Sdk nebula-ios-module-sdk -Llvm "$(brew --prefix llvm)/bin" -Out module-test
          foreach ($m in 'RMGE01_game', 'RMGE01_home_button', 'RMGE01_dsp') {
            xcrun vtool -show-build "module-test/Frameworks/$m.framework/$m"
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: nebula-ios-module-sdk
          path: nebula-ios-module-sdk

  ios-module-kit:
    name: iOS module kit (build check on Windows, as on the user's PC)
    runs-on: windows-2022
    needs: ios-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nebula-ios-module-sdk
          path: nebula-ios-module-sdk
      - name: Build nebula-recomp
        run: cargo build --release --locked -p nebula-recomp
      - name: Add real recompiler output (public synthetic code) to the test tree
        shell: pwsh
        run: |
          $env:GALAXY_MULTI_GPR_CPP_FIXTURE = "$PWD\tools\ios\test\fake-generated\game\functions_0000.cpp"
          cargo test --release --locked -p nebula-recomp-core multi_register_public_cpp_fixture
          if (-not (Test-Path $env:GALAXY_MULTI_GPR_CPP_FIXTURE)) { throw 'no fixture written' }
      - name: Build the test modules with build-modules.ps1
        shell: pwsh
        run: |
          & "C:\Program Files\LLVM\bin\clang++.exe" --version
          ./tools/ios/build-modules.ps1 -Generated tools/ios/test/fake-generated -Sdk nebula-ios-module-sdk -Out module-test
          & "C:\Program Files\LLVM\bin\llvm-nm.exe" -gU module-test/Frameworks/RMGE01_game.framework/RMGE01_game
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Package the PC kit
        shell: pwsh
        run: |
          New-Item -ItemType Directory kit | Out-Null
          Copy-Item target/release/nebula-recomp.exe, tools/ios/build-modules.ps1 kit/
          Copy-Item -Recurse nebula-ios-module-sdk kit/nebula-ios-module-sdk
      - uses: actions/upload-artifact@v4
        with:
          name: nebula-ios-pc-kit
          path: kit

  windows-x64:
    name: Windows x64 (MSVC build + tests, regression check)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
      - name: Build
        shell: bash
        run: cmake --build build -- -k 0 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Surface build errors
        if: failure()
        shell: bash
        run: grep -E "error|FAILED" build.log | head -40 | sed 's/^/::error::/' || true
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          failed=0
          # Tests that already fail on unmodified upstream (keepvaibin/nebula
          # v1.0.0, checked on this runner); anything else failing is a
          # regression from the port.
          # (galaxy_vertex_loader_tests also failed upstream, from
          # uninitialized vertex padding; the port fixed that.)
          known="galaxy_native_settings_overlay_tests.exe galaxy_native_host_tests.exe"
          for exe in build/galaxy_*_tests.exe; do
            name=$(basename "$exe")
            # One retry: a few timing-based tests flake on shared runners.
            if ! "$exe" > out.txt 2>&1 && ! "$exe" > out.txt 2>&1; then
              if [[ " $known " == *" $name "* ]]; then
                echo "::warning::$name fails on upstream too (known)"
              else
                failed=1
                echo "::error::$name failed: $(tail -3 out.txt | tr '\n' ' ')"
              fi
            elif [[ " $known " == *" $name "* ]]; then
              echo "::notice::$name now passes; remove it from the known list"
            fi
          done
          exit $failed
